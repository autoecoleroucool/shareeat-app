<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Share Eat - Home Map View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#49e619",
                        "background-light": "#f6f8f6",
                        "background-dark": "#152111",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .map-gradient {
            background: radial-gradient(circle at center, #f0fdf4 0%, #f6f8f6 100%);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 overflow-hidden">
<!-- Main Container (Mobile Form Factor) -->
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto bg-white shadow-2xl">
<!-- Full Screen Map Background -->
<div class="absolute inset-0 z-0 map-gradient" data-location="San Francisco Neighborhood" style="">
<!-- Simulated Map Elements -->
<div class="absolute inset-0 opacity-20" data-alt="Light themed minimalist city map grid" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDLXhTq8RtiPDJ9VcshpKmmZwEJOqJcCaN-Pc9ZyXRq8QIMMhchHVPP8JhzOf1odAaZv1rJilDaSyU5EPCKaci8hOzHY0EYJBybiI1zaa5JJq0vTE5DqQba2mdNDySvS-JzK0cPlQeRdAxndbOOXXbkcCGy_YdprGEvZnHBrKyqZNSktIzK6LFdrltD_-4wTJvhiJsDGm-OlB1IwlfSAUuONbw_6dQMqpckAkxEMbBXHMKF1UgdKB4o9z6FceErhOAyabYa2ad6a7E'); background-size: cover;"></div>
<!-- Custom Map Pins -->
<!-- Pin 1: Selected Lasagna -->
<div class="absolute top-[45%] left-[40%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-primary p-3 rounded-full shadow-lg border-4 border-white animate-pulse">
<span class="material-symbols-outlined text-white text-2xl">restaurant</span>
</div>
<div class="w-1 h-3 bg-white shadow-sm -mt-1"></div>
</div>
<!-- Pin 2: Salad -->
<div class="absolute top-[25%] left-[70%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-80">
<div class="bg-primary/80 p-2 rounded-full shadow-md border-2 border-white">
<span class="material-symbols-outlined text-white text-xl">eco</span>
</div>
</div>
<!-- Pin 3: Pizza -->
<div class="absolute top-[60%] left-[20%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-80">
<div class="bg-primary/80 p-2 rounded-full shadow-md border-2 border-white">
<span class="material-symbols-outlined text-white text-xl">local_pizza</span>
</div>
</div>
<!-- Pin 4: Soup -->
<div class="absolute top-[35%] left-[15%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-80">
<div class="bg-primary/80 p-2 rounded-full shadow-md border-2 border-white">
<span class="material-symbols-outlined text-white text-xl">soup_kitchen</span>
</div>
</div>
</div>
<!-- Top Floating Search Bar -->
<div class="relative z-20 px-4 pt-12">
<div class="flex items-center bg-white/90 backdrop-blur-md rounded-full shadow-xl px-4 py-2 border border-white/20">
<span class="material-symbols-outlined text-slate-400 mr-2">search</span>
<input class="bg-transparent border-none focus:ring-0 text-sm font-medium w-full placeholder:text-slate-400" placeholder="Search for meals nearby..." type="text"/>
<div class="h-8 w-8 rounded-full bg-background-light flex items-center justify-center ml-2">
<span class="material-symbols-outlined text-slate-600 text-xl">tune</span>
</div>
</div>
</div>
<!-- Floating Action Buttons -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-3">
<button class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-slate-700 hover:bg-slate-50">
<span class="material-symbols-outlined">my_location</span>
</button>
<button class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-slate-700 hover:bg-slate-50">
<span class="material-symbols-outlined">layers</span>
</button>
</div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 left-0 right-0 z-30 flex flex-col">
<!-- Bottom Sheet Visual Handle -->
<div class="flex justify-center mb-2">
<div class="w-12 h-1.5 bg-white/40 rounded-full"></div>
</div>
<!-- Meal Card Detail Sheet -->
<div class="bg-white rounded-t-xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-5 pb-8">
<!-- Meal Preview Card -->
<div class="flex gap-4">
<div class="relative w-32 h-32 rounded-lg overflow-hidden shrink-0 shadow-sm">
<img alt="Lasagna" class="w-full h-full object-cover" data-alt="Close up shot of cheesy homemade lasagna in a tray" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxi-YQDUcLqLktBfP5ezxk50cYoPDZsh-oBvNutoustMcdULkaJA0ClqqermvzTNKhH4mwJqTWd43tNMjFGDfjKZgV5nsN6Xu8rpG7redWSAdSlILAu69eF0ZsL1zVpCV-y9_Jk5e-DY111N9VAfJpSCgL4kkK80luUtPdXazDdvqdrxgCqpCrwqTMrGTga_CBrC01aeqaLy8hPVhE16j7P2zl66y9Rmi7MgNfqSgIFF2QlaGvogy3zuxeS17B13vslQnUx_F3Hx8"/>
<div class="absolute top-2 left-2 bg-primary text-[10px] font-bold text-white px-2 py-0.5 rounded-full uppercase tracking-wider">
                            Popular
                        </div>
</div>
<div class="flex flex-col justify-between flex-1 py-1">
<div>
<div class="flex justify-between items-start">
<h3 class="text-xl font-bold text-slate-900 leading-tight">Homemade Lasagna</h3>
<span class="material-symbols-outlined text-slate-300">favorite</span>
</div>
<p class="text-sm text-slate-500 mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-xs">person</span>
                                Maria G. • <span class="text-primary font-medium">0.4 miles</span>
</p>
</div>
<div class="flex items-center gap-4 mt-2">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-yellow-400 text-sm fill-1">star</span>
<span class="text-xs font-bold text-slate-700">4.9</span>
<span class="text-[10px] text-slate-400">(24)</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-primary text-sm">schedule</span>
<span class="text-xs font-medium text-slate-700">Ready in 20m</span>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-6 flex gap-3">
<button class="flex-1 bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-full shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                        Join Share
                    </button>
<button class="w-14 h-14 border-2 border-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-50">
<span class="material-symbols-outlined">chat_bubble</span>
</button>
</div>
</div>
<!-- Navigation Bar -->
<div class="bg-white border-t border-slate-50 px-6 py-4 flex justify-between items-center pb-8">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-1">map</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Map</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Explore</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<div class="relative">
<span class="material-symbols-outlined">shopping_bag</span>
<div class="absolute -top-1 -right-1 w-2 h-2 bg-primary rounded-full border-2 border-white"></div>
</div>
<span class="text-[10px] font-bold uppercase tracking-widest">Orders</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Profile</span>
</a>
</div>
</div>
</div>
</body></html>
