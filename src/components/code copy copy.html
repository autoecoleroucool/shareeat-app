<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Share Eat - Create a Meal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5de619",
                        "background-light": "#f6f8f6",
                        "background-dark": "#162111",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen shadow-2xl relative flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Create a Meal</h1>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-32">
<!-- Image Upload Section -->
<section class="px-6 pt-4">
<div class="group relative w-full aspect-square rounded-xl bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center overflow-hidden cursor-pointer hover:border-primary transition-colors">
<div class="flex flex-col items-center gap-2 text-slate-400 dark:text-slate-500 group-hover:text-primary">
<span class="material-symbols-outlined text-5xl">add_a_photo</span>
<p class="font-medium">Add a photo of your dish</p>
</div>
<!-- Hidden background image placeholder style if uploaded -->
<div class="absolute inset-0 bg-cover bg-center hidden" data-alt="A delicious freshly prepared healthy meal bowl" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAMS_I6fHCeaMGPd3KYwFQf1Yl0lFMyUw2vlHmqt6nsyrDfssWVoJzaRmaA4Adl6TqTgJ2UXOxJUXCSLOl79pmyQ4L1tnRQ0dRONk5vlee5JBBsTszZyW64ozNPX4buQlTJoSuxnf_ubh6B4L1cIVDZei1dDHu2IQs7Bbmmftx80EEXxj8tc8Ga4e7APzc12olf1fNEateJ049IVSwSZxnrAqaNxEqvau6sHeKnD4OFu8BtM0I2ofzFlOljKHgWXbNweu-_Uxg5oaA')"></div>
</div>
</section>
<!-- Form Section -->
<section class="px-6 mt-8 space-y-6">
<!-- Title Input -->
<div class="space-y-2">
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 ml-1">What are you cooking?</label>
<input class="w-full h-14 px-6 rounded-full border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary transition-all text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="Meal Title (e.g. Homemade Lasagna)" type="text"/>
</div>
<!-- Description Input -->
<div class="space-y-2">
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 ml-1">Description</label>
<textarea class="w-full min-h-[120px] p-6 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary transition-all text-slate-900 dark:text-white placeholder:text-slate-400 resize-none" placeholder="Describe ingredients or flavors..."></textarea>
</div>
<!-- Dietary Tags -->
<div class="space-y-3">
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300 ml-1">Dietary Info</label>
<div class="flex flex-wrap gap-2">
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium hover:bg-primary/10 hover:border-primary transition-colors">Gluten-free</button>
<button class="px-5 py-2 rounded-full border border-primary bg-primary/10 text-primary text-sm font-bold">Vegan</button>
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium hover:bg-primary/10 hover:border-primary transition-colors">Nut-free</button>
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium hover:bg-primary/10 hover:border-primary transition-colors">Dairy-free</button>
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium hover:bg-primary/10 hover:border-primary transition-colors">Spicy</button>
</div>
</div>
<!-- Map Preview Section -->
<div class="space-y-3">
<div class="flex items-center justify-between ml-1">
<label class="block text-sm font-bold text-slate-700 dark:text-slate-300">Pickup Location</label>
<button class="text-xs font-bold text-primary">Edit Map</button>
</div>
<div class="relative w-full h-32 rounded-xl bg-slate-200 dark:bg-slate-800 overflow-hidden group cursor-pointer">
<div class="absolute inset-0 bg-cover bg-center grayscale-[0.2]" data-alt="Minimal map showing Brooklyn neighborhood" data-location="Brooklyn, New York" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAKVdXHmVyWBKomCksHcu9DKq9Cy9b5Td0VXycVKrXPxPsH9dJ6tnwVw9SIDOqdGEjlVbPdWPdVo6Bj5DMYai25K92OI2sU-HHXSKl2ftKQaOKwiEp5MDXko5p2cZ4YbQqkGjeNZCsRanjbZD__DpbMty15eoyOWAm9E6lVGHwhqPZOVGS174jjtQHHj7cCLkVuDcesVJOLGAasiQKXSeBBZQvJkanHZkCaY7PHHFAyK2RVXXL_WKlxEZBuggae72PryOUXy3cGcI4');"></div>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-10 h-10 bg-primary rounded-full shadow-lg flex items-center justify-center text-white ring-4 ring-white/30">
<span class="material-symbols-outlined">location_on</span>
</div>
</div>
<div class="absolute bottom-2 left-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold shadow-sm">
                            Williamsburg, NY
                        </div>
</div>
</div>
</section>
</main>
<!-- Fixed Footer Action -->
<footer class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-white via-white dark:from-slate-900 dark:via-slate-900 to-transparent">
<button class="w-full h-16 bg-primary hover:bg-primary/90 text-slate-900 font-extrabold text-lg rounded-full shadow-xl shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-95">
<span>Publish Meal</span>
<span class="material-symbols-outlined">send</span>
</button>
</footer>
</div>
</body></html>
